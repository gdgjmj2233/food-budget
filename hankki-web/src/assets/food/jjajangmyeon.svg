<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    짜장면. 다른 음식 아이콘(3D 이모지)과 같은 그림체: 테두리 선 없이 면과 그라데이션으로만,
    왼쪽 위에서 빛, 흰 그릇의 그늘은 연보라, 윤기 하이라이트. 그릇이 칸을 꽉 채우게.
  -->
  <defs>
    <linearGradient id="jj-body" x1="0.25" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EDE9FB"/>
      <stop offset="1" stop-color="#B4A9DE"/>
    </linearGradient>
    <linearGradient id="jj-foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4BAEA"/>
      <stop offset="1" stop-color="#9184CC"/>
    </linearGradient>
    <linearGradient id="jj-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2557C2"/>
      <stop offset="0.4" stop-color="#4C8EF4"/>
      <stop offset="1" stop-color="#1F47A6"/>
    </linearGradient>
    <radialGradient id="jj-noodle" cx="0.45" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset="0.6" stop-color="#F8C24A"/>
      <stop offset="1" stop-color="#E39A22"/>
    </radialGradient>
    <radialGradient id="jj-sauce" cx="0.34" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#A06A44"/>
      <stop offset="0.3" stop-color="#633C22"/>
      <stop offset="0.75" stop-color="#34200F"/>
      <stop offset="1" stop-color="#211309"/>
    </radialGradient>
    <linearGradient id="jj-cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3D0"/>
      <stop offset="1" stop-color="#DDA65A"/>
    </linearGradient>
    <linearGradient id="jj-cuke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2F584"/>
      <stop offset="1" stop-color="#47952A"/>
    </linearGradient>
    <radialGradient id="jj-gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(0 -3)">
    <!-- 그릇 굽 -->
    <rect x="20" y="52" width="24" height="9" rx="3.5" fill="url(#jj-foot)"/>
    <!-- 그릇 몸통 -->
    <path d="M1.5 31h61c0 15.8-13.7 27.5-30.5 27.5S1.5 46.8 1.5 31z" fill="url(#jj-body)"/>
    <!-- 그릇 파란 띠 -->
    <path d="M3.2 38.4Q32 45.4 60.8 38.4L59.9 42Q32 49.2 4.1 42z" fill="url(#jj-band)"/>
    <!-- 그릇 입구 -->
    <ellipse cx="32" cy="31" rx="30.5" ry="8.2" fill="#F6F3FF"/>
    <ellipse cx="32" cy="31.6" rx="27.6" ry="6.8" fill="#CBC1EE"/>
    <!-- 면 -->
    <ellipse cx="32" cy="31.2" rx="26.4" ry="6.2" fill="url(#jj-noodle)"/>
    <g fill="none" stroke="#D88E1E" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
      <path d="M9 32.6c3.6-2.4 7.4-2.4 11 0"/>
      <path d="M44 32.6c3.6-2.4 7.4-2.4 11 0"/>
    </g>
    <!-- 짜장 소스 -->
    <path d="M11.5 31.2C11.5 19.6 20.7 12 32 12s20.5 7.6 20.5 19.2c0 3.2-9.2 5-20.5 5s-20.5-1.8-20.5-5z" fill="url(#jj-sauce)"/>
    <!-- 소스 윤기 -->
    <ellipse cx="24.5" cy="19" rx="7.5" ry="3.6" fill="url(#jj-gloss)" transform="rotate(-28 24.5 19)"/>
    <!-- 감자·양파 건더기 -->
    <rect x="17" y="24.2" width="6.4" height="5.8" rx="1.9" fill="url(#jj-cube)" transform="rotate(-12 20.2 27.1)"/>
    <rect x="39.6" y="24.6" width="6.2" height="5.6" rx="1.9" fill="url(#jj-cube)" transform="rotate(14 42.7 27.4)"/>
    <rect x="28.6" y="27" width="5.8" height="5.2" rx="1.7" fill="url(#jj-cube)"/>
    <rect x="35" y="18.6" width="5" height="4.6" rx="1.5" fill="url(#jj-cube)" transform="rotate(8 37.5 20.9)"/>
    <!-- 오이채 -->
    <rect x="23.5" y="10.6" width="16" height="3.4" rx="1.7" fill="url(#jj-cuke)" transform="rotate(-26 31.5 12.3)"/>
    <rect x="25" y="13.2" width="15" height="3.4" rx="1.7" fill="url(#jj-cuke)" transform="rotate(-6 32.5 14.9)"/>
    <rect x="27.5" y="10.2" width="13" height="3.4" rx="1.7" fill="url(#jj-cuke)" transform="rotate(38 34 11.9)"/>
  </g>
</svg>
