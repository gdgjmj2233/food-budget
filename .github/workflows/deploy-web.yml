# main 브랜치에 올릴 때마다 웹 버전(hankki-web, Next.js)을 정적 파일로 빌드해서 GitHub Pages에 배포한다.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hankki-web/package-lock.json
      - run: npm ci
        working-directory: hankki-web
      - name: Export static site
        working-directory: hankki-web
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Disable Jekyll
        working-directory: hankki-web
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hankki-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
